<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List Flask</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
       
    </head>
    <body>
        <h1>To-Do List</h1>
        <form action="{{ url_for('home') }}" class="input-container" method="POST">
            <input type="text" placeholder="Enter a new task" id="input-task" name="task">
            <button id="Add-Todo">+</button>
        </form>
        <h2>Tasks</h2>
        <div class="tasks-container">
            {% for item in items %}
            <div class="Task-Item">
                <p>{{ item.name }}</p>
                <div class="Actions">
                    <form action="{{ url_for('checked', task_id=item.id) }}" method="POST">
                        <input type="checkbox" {% if item.checked %}checked{% endif %} onchange="this.form.submit()">
                    </form>
                    <form action="{{ url_for('delete_tasks', task_id=item.id) }}" method="POST">
                        <button>Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    </body>
</html>
